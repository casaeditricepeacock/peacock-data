name: Valida grafo Peacock

# Gira da sola a ogni push e su ogni pull request.
# Se validate.py trova errori, il commit viene marcato con una X rossa su GitHub.
# Non serve installare nulla in locale: e la rete di sicurezza per chi lavora da browser.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repo
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui il validatore
        run: python3 validate.py .
